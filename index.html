<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung</title>
<style>
  :root {
    --bg: #f6f7f4;
    --surface: #ffffff;
    --ink: #1c2321;
    --muted: #5d6965;
    --line: #d9ded9;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --full: #a33b2d;
    --pick: #e3f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a18;
      --surface: #1e2522;
      --ink: #eef2ef;
      --muted: #9aa7a2;
      --line: #33403b;
      --accent: #5cc2a5;
      --accent-ink: #0e1512;
      --full: #ee8b7c;
      --pick: #23352f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .options { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .options { grid-template-columns: repeat(3, 1fr); } }

  .opt {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: block;
    width: 100%;
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--pick); }
  .opt:disabled { cursor: not-allowed; opacity: .7; }
  .opt:focus-visible, input:focus-visible, button.go:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .opt h2 { font-size: 1.15rem; margin: 0 0 2px; }
  .left { font-size: 1.9rem; font-weight: 700; line-height: 1.1; margin: 8px 0 0; }
  .left small { font-size: .9rem; font-weight: 400; color: var(--muted); }
  .left.full { color: var(--full); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .names { list-style: none; margin: 0; padding: 0; min-height: 1.4em; }
  .names li { padding: 3px 0; border-top: 1px solid var(--line); }
  .names li:first-child { border-top: 0; }
  .names li.me { font-weight: 700; }

  form { margin: 22px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 200px; min-width: 0;
    font: inherit; font-size: 1.1rem;
    padding: 12px; border-radius: 8px;
    border: 2px solid var(--line);
    background: var(--surface); color: var(--ink);
  }
  button.go {
    font: inherit; font-size: 1.1rem; font-weight: 600;
    padding: 12px 22px; border-radius: 8px; border: 0;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: not-allowed; }
  #msg { min-height: 1.5em; margin: 10px 0 0; color: var(--muted); }
  #msg.err { color: var(--full); }
  #print { display: none; margin-top: 14px; font: inherit; padding: 10px 18px; border-radius: 8px;
    border: 2px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; }
  body.teacher #print { display: inline-block; }
  @media print {
    body { background: #fff; color: #000; }
    form, #msg, #status, #print, #title, .bar, .sub, .left small { display: none !important; }
    .options { display: block; }
    .opt { border: 0; padding: 0; background: #fff !important; page-break-after: always; break-after: page; }
    .opt:last-child { page-break-after: auto; break-after: auto; }
    .opt h2 { font-size: 20pt; margin: 0 0 4pt; }
    .left { font-size: 12pt; margin: 0 0 10pt; color: #000 !important; }
    .names { counter-reset: n; }
    .names li { counter-increment: n; font-size: 13pt; padding: 5pt 0; border-top: 0; border-bottom: .5pt solid #999; font-weight: 400 !important; }
    .names li::before { content: counter(n) ".  "; display: inline-block; width: 28pt; color: #555; }
  }
  #status { color: var(--muted); font-size: .9rem; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <div class="options" id="options"></div>

  <form id="form" autocomplete="off">
    <input type="text" id="name" maxlength="40" placeholder="Dein Name" aria-label="Dein Name" required>
    <button class="go" id="go" type="submit">Eintragen</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <p id="status"></p>
  <button type="button" id="print">Liste drucken</button>
</main>

<script type="module">
/* =====================  1. HIER ANPASSEN  ===================== */

const TITLE = "IDAF Projekte 2026";
const SUBTITLE = "Wähle ein Projekt, gib deinen Vor- und Nachnamen ein und tippe auf Eintragen.";

// Plätze pro Option. Muss mit den Regeln in Firebase übereinstimmen (siehe Anleitung).
const OPTIONS = [
  { id: "a", label: "Energiewende", cap: 40 },
  { id: "b", label: "Moda sostensibile", cap: 40 },
  { id: "c", label: "Sustainable Energy", cap: 40 },
];

// Aus Firebase: Projekteinstellungen > Deine Apps > Web-App > firebaseConfig
const firebaseConfig = {
  apiKey: "AIzaSyBici_bNb8M7v2IYQ4i5TtB_VU-g3f-F4Q",
  authDomain: "idaf-projekte-2026.firebaseapp.com",
  databaseURL: "https://idaf-projekte-2026-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "idaf-projekte-2026",
  appId: "1:288064654042:web:e6f6354e309447b593f3e3"
};

/* ============================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = (id) => document.getElementById(id);
$("title").textContent = TITLE;
$("sub").textContent = SUBTITLE;
document.title = TITLE;

let selected = null;
let data = {};          // { a: { "1": "Anna", "2": "Ben" }, ... }
let mine = null;        // { opt, slot } on this device
try { mine = JSON.parse(localStorage.getItem("signup-mine") || "null"); } catch (e) {}

const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };

const configured = !Object.values(firebaseConfig).some(v => String(v).startsWith("HIER"));
let db = null;
if (configured) {
  try { db = getDatabase(initializeApp(firebaseConfig)); }
  catch (e) { msg("Verbindung zu Firebase fehlgeschlagen.", true); }
} else {
  msg("Firebase-Konfiguration fehlt. Siehe Anleitung.", true);
}

function render() {
  const wrap = $("options");
  wrap.textContent = "";
  for (const o of OPTIONS) {
    const slots = data[o.id] || {};
    const entries = Object.keys(slots)
      .map(Number).filter(n => n >= 1 && n <= o.cap)
      .sort((a, b) => a - b)
      .map(n => ({ n, name: String(slots[n]) }));
    const free = o.cap - entries.length;

    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.disabled = free <= 0;
    b.setAttribute("aria-pressed", selected === o.id ? "true" : "false");
    b.addEventListener("click", () => { selected = o.id; msg(""); render(); $("name").focus(); });

    const h = document.createElement("h2"); h.textContent = o.label;
    const l = document.createElement("p");
    l.className = "left" + (free <= 0 ? " full" : "");
    l.textContent = free <= 0 ? "Voll" : free + " ";
    if (free > 0) { const s = document.createElement("small"); s.textContent = free === 1 ? "Platz frei" : "Plätze frei"; l.appendChild(s); }

    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = (entries.length / o.cap * 100) + "%";
    bar.appendChild(fill);

    const ul = document.createElement("ul"); ul.className = "names";
    for (const e of entries) {
      const li = document.createElement("li");
      li.textContent = e.name;
      if (mine && mine.opt === o.id && mine.slot === e.n) li.className = "me";
      ul.appendChild(li);
    }
    b.append(h, l, bar, ul);
    wrap.appendChild(b);
  }
  const alreadyIn = !!mine;
  $("go").disabled = !db || alreadyIn;
  $("name").disabled = alreadyIn;
  if (alreadyIn && !$("msg").textContent) msg("Du bist eingetragen.");
}

if (db) {
  const t = setTimeout(() => { $("status").textContent = "Daten noch nicht erreichbar, Anzeige evtl. veraltet."; }, 10000);
  onValue(ref(db, "options"),
    (snap) => { clearTimeout(t); $("status").textContent = ""; data = snap.val() || {}; render(); },
    () => { clearTimeout(t); $("status").textContent = "Lesen nicht möglich. Regeln in Firebase prüfen."; });
}
render();

if (location.hash === "#lehrer") document.body.classList.add("teacher");
$("print").addEventListener("click", () => window.print());

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!db || mine) return;
  const name = $("name").value.trim().replace(/\s+/g, " ");
  if (!selected) return msg("Bitte zuerst eine Option antippen.", true);
  if (!name) return msg("Bitte Namen eingeben.", true);

  const o = OPTIONS.find(x => x.id === selected);
  $("go").disabled = true;
  msg("Trage ein …");
  try {
    for (let n = 1; n <= o.cap; n++) {
      const r = await runTransaction(ref(db, `options/${o.id}/${n}`),
        (cur) => (cur === null ? name : undefined));
      if (r.committed) {
        mine = { opt: o.id, slot: n };
        try { localStorage.setItem("signup-mine", JSON.stringify(mine)); } catch (e) {}
        msg("Eingetragen in " + o.label + ".");
        render();
        return;
      }
    }
    msg(o.label + " ist inzwischen voll. Bitte eine andere Option wählen.", true);
  } catch (e) {
    msg("Eintragen nicht möglich. Bitte nochmals versuchen.", true);
  }
  render();
});
</script>
</body>
</html>
